# Contoh konfigurasi Nginx untuk Orkay.
# Salin ke /etc/nginx/sites-available/orkay lalu symlink ke sites-enabled.
#
# Karena HTTPS/TLS di-handle Cloudflare Tunnel, Nginx cukup dengar di port 80
# secara lokal. Cloudflared akan meneruskan ke http://localhost:80.
#
# Nginx meng-handle:
#   - reverse proxy /api  -> Express (localhost:3001)
#   - static React build  -> /var/www/orkay (client/dist)
#   - SPA fallback        -> index.html

server {
    listen 80;
    server_name _;

    # Ukuran body (buat kejadian import besar di masa depan)
    client_max_body_size 5m;

    root /var/www/orkay;
    index index.html;

    # API -> Express
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aset statis dengan cache panjang (file ber-hash dari Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: semua route lain -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# CATATAN: Kalau kamu lebih suka Express yang serve static (tanpa menyalin
# build ke /var/www), cukup arahkan SEMUA request ke Express:
#
#   location / {
#       proxy_pass http://127.0.0.1:3001;
#       proxy_set_header Host $host;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   }
#
# dan jalankan server dengan NODE_ENV=production (Express sudah serve client/dist).
